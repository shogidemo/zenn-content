name: Dependabot Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}
      dependency-names: ${{ steps.metadata.outputs.dependency-names }}
      package-ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  validate-actions:
    needs: metadata
    runs-on: ubuntu-latest
    if: needs.metadata.outputs.package-ecosystem == 'github_actions'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate workflow syntax
        run: |
          for file in .github/workflows/*.yml; do
            echo "Validating $file"
            python3 -c "import yaml; yaml.safe_load(open('$file'))"
          done

  auto-merge:
    needs: [metadata, validate-actions]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.metadata.result == 'success' &&
      (needs.validate-actions.result == 'success' || needs.validate-actions.result == 'skipped') &&
      (needs.metadata.outputs.update-type == 'version-update:semver-minor' ||
       needs.metadata.outputs.update-type == 'version-update:semver-patch')
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  label-major:
    concurrency:
      group: ${{ github.workflow }}-major-warning-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    needs: metadata
    runs-on: ubuntu-latest
    if: needs.metadata.outputs.update-type == 'version-update:semver-major'
    steps:
      - name: Add review-required label
        run: gh pr edit "$PR_URL" --add-label "review-required,major-update"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add comment for major update
        run: |
          set -euo pipefail

          COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --slurp |
            jq -r 'flatten | map(select(.user.login == "github-actions[bot]" and ((.body | contains("<!-- dependabot-major-warning -->")) or (.body | startswith("## :warning: メジャーバージョンアップデート"))))) | last | .id // empty')

          BODY=$(cat <<EOF
          <!-- dependabot-major-warning -->
          ## :warning: メジャーバージョンアップデート

          このPRはメジャーバージョンのアップデートを含んでいます。
          Breaking changesがある可能性があるため、手動でのレビューが必要です。

          **更新内容**: $DEPENDENCY_NAMES

          確認後、問題がなければマージしてください。
          EOF
          )

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPENDENCY_NAMES: ${{ needs.metadata.outputs.dependency-names }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
