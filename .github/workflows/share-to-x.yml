name: Share to X

on:
  push:
    branches:
      - main
    paths:
      - "articles/*.md"

permissions:
  contents: read

# 並行実行による重複投稿を防止（予約投稿とは別グループ）
concurrency:
  group: share-to-x-${{ github.ref }}
  cancel-in-progress: false

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # 複数コミットのpushに対応するため全履歴を取得

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Find newly published articles
        id: find-articles
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          ARTICLES=$(node .github/scripts/find-articles.js --immediate --before-sha "$BEFORE_SHA" --after-sha "$AFTER_SHA")
          echo "articles=$ARTICLES" >> $GITHUB_OUTPUT
          echo "Found articles: $ARTICLES"

      - name: Post to X
        if: steps.find-articles.outputs.articles != '[]'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ZENN_USERNAME: ${{ secrets.ZENN_USERNAME }}
          ARTICLES: ${{ steps.find-articles.outputs.articles }}
        run: node .github/scripts/post-to-x.js
