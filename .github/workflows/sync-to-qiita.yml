name: Sync to Qiita

on:
  push:
    branches:
      - main
    paths:
      - "articles/*.md"
  workflow_dispatch: # 手動実行（初回フル同期用）
    inputs:
      dry_run:
        description: "Dry run (投稿せずに確認のみ)"
        required: false
        type: boolean
        default: false
      single_slug:
        description: "特定の記事のみ対象（slugを指定、空欄で全記事）"
        required: false
        type: string
        default: ""

permissions:
  contents: write # qiita_idをFront Matterに追加するため

# 並行実行による競合を防止
concurrency:
  group: sync-to-qiita-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 自己トリガー防止
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # 差分検出用

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Find articles to sync
        id: find-articles
        env:
          EVENT_NAME: ${{ github.event_name }}
          SINGLE_SLUG: ${{ inputs.single_slug }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          # pushトリガー時は変更ファイルを取得
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            export CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'articles/*.md' | tr '\n' ' ')
          fi

          ARTICLES=$(node .github/scripts/find-articles-for-qiita.js)

          # heredoc形式でGITHUB_OUTPUTに書き込み（特殊文字対策）
          {
            echo 'articles<<EOF'
            echo "$ARTICLES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Found articles: $ARTICLES"

      - name: Convert and post to Qiita
        if: steps.find-articles.outputs.articles != '[]'
        env:
          ARTICLES: ${{ steps.find-articles.outputs.articles }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
          # push時はundefinedになるため、明示的にfalseをデフォルト設定
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail

          # 変換結果をファイルに出力
          node .github/scripts/convert-to-qiita.js > /tmp/converted.json

          # 投稿スクリプトに渡す
          export CONVERTED_ARTICLES=$(cat /tmp/converted.json)
          if [ "$DRY_RUN" = "true" ]; then
            node .github/scripts/post-to-qiita.js --dry-run
          else
            node .github/scripts/post-to-qiita.js
          fi

      - name: Commit qiita_id changes
        # push時はinputs.dry_runがnull/undefinedになるため、明示的に比較
        if: steps.find-articles.outputs.articles != '[]' && inputs.dry_run != true
        run: |
          set -uo pipefail  # -eは使わない（git diff --stagedの戻り値を利用するため）

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/*.md

          # 変更がなければ正常終了
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update qiita_id in front matter"

          # git push をリトライ（競合対策）
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push failed on attempt $i, retrying with rebase..."
            if ! git pull --rebase; then
              echo "Rebase conflict, aborting rebase..."
              git rebase --abort 2>/dev/null || true
            fi
          done

          echo "Push failed after $MAX_RETRIES attempts"
          exit 1
