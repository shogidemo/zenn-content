name: Share Scheduled Articles to X

on:
  schedule:
    - cron: "0,30 * * * *" # 30分ごとにチェック
  workflow_dispatch: # 手動実行も可能
    inputs:
      dry_run:
        description: "Dry run (投稿せずに確認のみ)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # x_shared: true を追加してコミットするために必要

# 並行実行による重複投稿を防止
concurrency:
  group: share-scheduled-to-x-${{ github.ref }}
  cancel-in-progress: false # 途中キャンセルは二重投稿を誘発するため

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # git pull --rebase に必要

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Find articles to share
        id: find-articles
        run: |
          ARTICLES=$(node .github/scripts/find-articles.js --scheduled)
          echo "articles=$ARTICLES" >> $GITHUB_OUTPUT
          echo "Found articles: $ARTICLES"

      - name: Post to X and mark as shared
        if: steps.find-articles.outputs.articles != '[]'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ZENN_USERNAME: ${{ secrets.ZENN_USERNAME }}
          ARTICLES: ${{ steps.find-articles.outputs.articles }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node .github/scripts/post-to-x.js --dry-run --mark-shared
          else
            node .github/scripts/post-to-x.js --mark-shared
          fi

      - name: Commit changes
        if: steps.find-articles.outputs.articles != '[]' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/*.md
          git diff --staged --quiet && exit 0

          git commit -m "chore: mark articles as shared to X"

          # git push をリトライ（競合対策）
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push failed on attempt $i, retrying with rebase..."
            if ! git pull --rebase; then
              echo "Rebase conflict, aborting rebase..."
              git rebase --abort 2>/dev/null || true
            fi
          done

          echo "Push failed after $MAX_RETRIES attempts"
          exit 1
